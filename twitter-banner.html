<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Banner - EVA Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --color-bg: #020617;
            --color-accent-blue: #2563eb;
            --color-accent-glow: rgba(37, 99, 235, 0.4);
            --color-text: #ffffff;
            --color-text-muted: #94a3b8;
            --font-main: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Banner Container fixed at Twitter Dimensions */
        .twitter-banner {
            width: 1500px;
            height: 500px;
            background: radial-gradient(circle at 30% 0%, #1e293b 0%, #020617 70%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 100px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05); /* Optional border for definition */
        }

        /* ASCII Background Texture */
        .bg-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.12;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            z-index: 1;
            mask-image: radial-gradient(circle, black, transparent 80%);
        }

        .texture-col {
            font-family: monospace;
            font-size: 8px;
            color: var(--color-accent-blue);
            word-break: break-all;
            width: 5%;
            line-height: 1.1;
            animation: scroll 60s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* Content Layout */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 150px;
        }

        /* Left Side List */
        .left-side {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: fit-content;
        }

        .list-item {
            font-family: var(--font-main);
            font-size: 2.2rem;
            color: #fff;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.9;
        }

        .list-item::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            display: block;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Right Side Services */
        .right-side {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
        }

        .headline {
            font-family: var(--font-main);
            font-size: 2rem;
            color: #fff;
            font-style: italic;
            font-weight: 400;
            letter-spacing: -0.01em;
            max-width: 800px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tag {
            padding: 8px 20px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 50px;
            color: #60a5fa;
            font-family: var(--font-main);
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .tag::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #2563eb;
            border-radius: 50%;
            box-shadow: 0 0 10px #2563eb;
        }

        /* Background Glows */
        .glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        .glow-1 { top: -200px; left: -200px; }
        .glow-2 { bottom: -200px; right: -200px; }

    </style>
</head>
<body>

    <div class="twitter-banner">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        
        <div class="bg-texture">
            <script>
                const textureCols = 20;
                const strings = [
                    "0101010110101010110101010110101010110101010110101010",
                    "EVA_STUDIO_MODE_ACCESS_GRANTED_INIT_SESSION_001010101101",
                    "CREATE_INNOVATE_DEVELOP_DEPLOY_REPEAT_001010101101010101",
                    "SYSTEM_INIT_MODE_EVA_STUDIO_2026_V1.0.4_STABLE_BUILD_RUNNING"
                ];
                for(let i=0; i<textureCols; i++) {
                    const col = document.createElement('div');
                    col.className = 'texture-col';
                    if(i % 2 === 0) col.style.animationDirection = 'reverse';
                    col.style.marginTop = Math.random() * 100 + 'px';
                    col.style.animationDuration = (40 + Math.random() * 40) + 's';
                    col.innerText = (strings[i % strings.length] + ' ').repeat(10);
                    document.querySelector('.bg-texture').appendChild(col);
                }
            </script>
        </div>

        <div class="content">
            <div class="left-side">
                <div class="list-item">Fiabilité</div>
                <div class="list-item">Design</div>
                <div class="list-item">Performance</div>
            </div>

            <div class="right-side">
                <div class="headline">
                    Site web, App, Référencement, Acquisition client en ligne
                </div>
                <div class="tags-container">
                    <div class="tag">React</div>
                    <div class="tag">Next JS</div>
                    <div class="tag">React Native</div>
                    <div class="tag">Flutter</div>
                    <div class="tag">TailwindCSS</div>
                    <div class="tag">Node JS</div>
                    <div class="tag">Nativewind</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
